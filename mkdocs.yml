site_name: Aleksey Pastukhov
site_description: Windows internals and security research — COM, DCOM, RPC, reverse engineering
site_url: https://ssteelfactor-oss.github.io/
site_author: Aleksey Pastukhov

repo_url: https://github.com/ssteelfactor-oss
repo_name: ssteelfactor-oss
edit_uri: ""

copyright: Aleksey Pastukhov

theme:
  name: material
  language: en
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  icon:
    logo: material/chip
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tooltips

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ssteelfactor-oss
      name: GitHub
  generator: false

plugins:
  - search:
      lang: en

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
      toc_depth: 3
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.smartsymbols
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Running Object Table:
      - running-object-table/index.md
      - Part 1 — Inside the ROT: running-object-table/part-1-inside-the-rot.md
      - Part 2 — Under the hood: running-object-table/part-2-under-the-hood.md
      - Part 4 — Reversing rpcss.dll: running-object-table/part-4-reversing-rpcss.md
  - Apartments:
      - The STA deadlock: apartments/com-sta-deadlock.md
